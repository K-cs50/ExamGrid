services:
  - type: web
    name: examgrid
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DB_HOST
        value: gateway01.ap-northeast-1.prod.aws.tidbcloud.com
      - key: DB_PORT
        value: "4000"
      - key: DB_USER
        value: 1C6dwZChUVjhPL7.root
      - key: DB_PASSWORD
        sync: false          # enter manually in Render dashboard
      - key: DB_NAME
        value: invigilator_db
      - key: DB_SSL
        value: "true"
      - key: NODE_ENV
        value: production

